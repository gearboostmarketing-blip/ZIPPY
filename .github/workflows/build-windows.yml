# Builds Zip-Receipt-Setup.exe on a GitHub-hosted Windows machine whenever the app changes.
# Download it from the Actions tab (run -> Artifacts), or from Releases when you push a tag like v1.0.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["index.html", "windows/**", ".github/workflows/build-windows.yml"]
    tags: ["v*", "V*"]
  release:
    types: [published]   # publishing a release on github.com also builds and attaches the installers
  workflow_dispatch:

# A release can start this twice (tag + published release): run them one after the other, never at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed only to attach the installer to a Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use the tag as the version (tags like v2.2 or V2.2 only)
        if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#[vV]}"
          sed -i.bak "s#const APP_VERSION = \"[^\"]*\"#const APP_VERSION = \"${V}\"#" index.html && rm -f index.html.bak
          sed -i.bak "s#^AppVersion=.*#AppVersion=${V}#" windows/installer.iss && rm -f windows/installer.iss.bak

      - name: Point the updater at this repository
        shell: bash
        run: sed -i.bak "s#__UPDATE_REPO__#${GITHUB_REPOSITORY}#" index.html && rm -f index.html.bak

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download packages (NuGet)
        shell: bash
        run: |
          dotnet restore windows/ZipReceipt.csproj -r win-x64 && exit 0
          echo "Restore failed, retrying with a detailed log..."
          sleep 20
          dotnet nuget locals all --clear
          dotnet restore windows/ZipReceipt.csproj -r win-x64 -v detailed

      - name: Build app
        shell: pwsh
        run: >
          dotnet publish windows/ZipReceipt.csproj -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o windows/publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Zip-Receipt-Windows
          path: windows/Output/Zip-Receipt-Setup.exe
          retention-days: 90

      - name: Attach to Release (tags only)
        if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" windows/Output/Zip-Receipt-Setup.exe --clobber \
            || gh release create "$GITHUB_REF_NAME" windows/Output/Zip-Receipt-Setup.exe --title "ZIPPY $GITHUB_REF_NAME" --notes "Installers for Mac and Windows."
