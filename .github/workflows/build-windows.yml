# Builds Zip-Receipt-Setup.exe on a GitHub-hosted Windows machine whenever the app changes.
# Download it from the Actions tab (run -> Artifacts), or from Releases when you push a tag like v1.0.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["index.html", "windows/**", ".github/workflows/build-windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the installer to a Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build app
        shell: pwsh
        run: >
          dotnet publish windows/ZipReceipt.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o windows/publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Zip-Receipt-Windows
          path: windows/Output/Zip-Receipt-Setup.exe
          retention-days: 90

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" windows/Output/Zip-Receipt-Setup.exe --clobber \
            || gh release create "$GITHUB_REF_NAME" windows/Output/Zip-Receipt-Setup.exe --title "Zip Receipt $GITHUB_REF_NAME" --notes "Installers for Mac and Windows."
