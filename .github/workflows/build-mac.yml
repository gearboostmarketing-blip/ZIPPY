# Builds Zip-Receipt.dmg on a GitHub-hosted Mac whenever the app changes.
# Download it from the Actions tab (run -> Artifacts), or from Releases when you push a tag like v1.0.
name: Build Mac app

on:
  push:
    branches: [main]
    paths: ["index.html", "mac/**", ".github/workflows/build-mac.yml"]
    tags: ["v*"]
  release:
    types: [published]   # publishing a release on github.com also builds and attaches the installers
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the DMG to a Release on tag pushes

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Use the tag as the version (tags like v2.2 only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i.bak "s#const APP_VERSION = \"[^\"]*\"#const APP_VERSION = \"${V}\"#" index.html && rm -f index.html.bak
          sed -i.bak "s#<key>CFBundleShortVersionString</key><string>[^<]*</string>#<key>CFBundleShortVersionString</key><string>${V}</string>#" mac/Info.plist && rm -f mac/Info.plist.bak

      - name: Point the updater at this repository
        run: sed -i.bak "s#__UPDATE_REPO__#${GITHUB_REPOSITORY}#" index.html && rm -f index.html.bak

      - name: Build app and DMG
        run: ./mac/build.sh --universal --dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: Zip-Receipt-dmg
          path: mac/build/Zip-Receipt.dmg
          retention-days: 90

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" mac/build/Zip-Receipt.dmg index.html --clobber \
            || gh release create "$GITHUB_REF_NAME" mac/build/Zip-Receipt.dmg index.html --title "ZIPPY $GITHUB_REF_NAME" --notes "Installers for Mac and Windows."
